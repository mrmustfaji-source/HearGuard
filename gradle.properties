org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# RakshaPDF wali hi wajah: Gradle ka file-watcher bahar se badli gayi source
# file ko "delete ho gayi" samajh leta hai, phir build sab "UP-TO-DATE" bata
# kar kuch compile nahi karti aur purana APK bana rehta hai - "BUILD
# SUCCESSFUL" dikhne ke bawajood.
org.gradle.vfs.watch=false

android.useAndroidX=true

# ===========================================================================
#  Yahan aur kuch jaan-boojh kar NAHI hai.
#
#  Pehle yahan RakshaPDF se copy kiye hue ek darjan flag pade the:
#
#      android.nonTransitiveRClass=false
#      android.defaults.buildfeatures.resvalues=true
#      android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
#      android.enableAppCompileTimeRClass=true
#      android.nonFinalResIds=false
#      android.usesSdkInManifest.disallowed=false
#      android.uniquePackageNames=false
#      android.dependency.useConstraints=true
#      android.builtInKotlin=false
#      android.newDsl=false
#
#  Wo saare RakshaPDF ki apni purani history ke liye hain - wo ek bada,
#  purana project hai jise naye default todte the. HeatGuard bilkul nayi hai
#  aur usme ek bhi library module nahi, koi resValue nahi, manifest mein koi
#  <uses-sdk> nahi. Yaani in flags ka yahan koi kaam hi nahi tha; wo bas
#  saath mein copy ho gaye the.
#
#  Aur har ek AGP ne DEPRECATED bata diya tha, saath mein "It will be removed
#  in version 10.0". Yaani ye warnings baad mein asli build failure banti -
#  isliye ab hata di gayi hain, chhupayi nahi gayi.
#
#  Warning chhupane wala rasta (android.sync.suppressAgpWarnings=...) jaan
#  boojh kar nahi liya: usse warning gayab ho jaati par flag bana rehta, aur
#  AGP 10 par build phir bhi ruk jaati.
# ===========================================================================
