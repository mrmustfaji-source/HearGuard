<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FF7043"/>
      <stop offset="0.55" stop-color="#C62828"/>
      <stop offset="1"    stop-color="#1565C0"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="90" cy="100" r="54"/></clipPath>
    <clipPath id="squircle"><rect x="196" y="46" width="108" height="108" rx="30"/></clipPath>
    <clipPath id="rounded"><rect x="302" y="46" width="108" height="108" rx="14"/></clipPath>
  </defs>
  <style>
    .shield { fill:#33FFFFFF; stroke:#FFFFFF; stroke-width:5; stroke-linejoin:round; }
    .therm  { fill:#FFFFFF; }
    .cap    { font-family:sans-serif; font-size:11px; fill:#888; text-anchor:middle; }
  </style>

  <!-- gol (Pixel jaisa) -->
  <g clip-path="url(#circle)">
    <rect x="36" y="46" width="108" height="108" fill="url(#bg)"/>
    <g transform="translate(36,46)">
      <path class="shield" d="M54,25 L78,34 L78,55 C78,71 67,81 54,86 C41,81 30,71 30,55 L30,34 Z"/>
      <g transform="translate(36.6,37.4) scale(1.45)">
        <path class="therm" d="M15,13V5c0,-1.66 -1.34,-3 -3,-3S9,3.34 9,5v8c-1.21,0.91 -2,2.37 -2,4c0,2.76 2.24,5 5,5s5,-2.24 5,-5C17,15.37 16.21,13.91 15,13zM11,5c0,-0.55 0.45,-1 1,-1s1,0.45 1,1h-1v1h1v2h-1v1h1v2h-2V5z"/>
      </g>
    </g>
  </g>
  <text class="cap" x="90" y="176">gol</text>

  <!-- squircle (Samsung/MIUI jaisa) -->
  <g clip-path="url(#squircle)">
    <rect x="196" y="46" width="108" height="108" fill="url(#bg)"/>
    <g transform="translate(196,46)">
      <path class="shield" d="M54,25 L78,34 L78,55 C78,71 67,81 54,86 C41,81 30,71 30,55 L30,34 Z"/>
      <g transform="translate(36.6,37.4) scale(1.45)">
        <path class="therm" d="M15,13V5c0,-1.66 -1.34,-3 -3,-3S9,3.34 9,5v8c-1.21,0.91 -2,2.37 -2,4c0,2.76 2.24,5 5,5s5,-2.24 5,-5C17,15.37 16.21,13.91 15,13zM11,5c0,-0.55 0.45,-1 1,-1s1,0.45 1,1h-1v1h1v2h-1v1h1v2h-2V5z"/>
      </g>
    </g>
  </g>
  <text class="cap" x="250" y="176">squircle (MIUI)</text>

  <!-- rounded square -->
  <g clip-path="url(#rounded)">
    <rect x="302" y="46" width="108" height="108" fill="url(#bg)"/>
    <g transform="translate(302,46)">
      <path class="shield" d="M54,25 L78,34 L78,55 C78,71 67,81 54,86 C41,81 30,71 30,55 L30,34 Z"/>
      <g transform="translate(36.6,37.4) scale(1.45)">
